[package]
name = "yag-desktop"
version = "0.1.0"
description = "YAG Desktop — remote-first AI client"
authors = ["YAG contributors"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
url = "2"
