tries out before the footer, so the bottom line of the - screen stays clear even in a long category. */ -.console-destinations ul { list-style: none; padding: 0; margin: 0; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 13%, #000 80%, transparent 95%); mask-image: linear-gradient(to bottom, transparent 0, #000 13%, #000 80%, transparent 95%); } +/* The rows are absolutely positioned, so this <ul> has zero height: a + mask-image on it would be measured against an empty box and clip the whole + column (that was the regression). The fade lives on .console-menu, which + really covers the screen, and keeps the footer line clear. */ +.console-destinations ul { list-style: none; padding: 0; margin: 0; } /* Size and opacity ride on --item-scale, set per row from the distance to the selection: the hardware interpolates continuously, not in two sizes. */ .console-destination-position { position: absolute; left: calc(var(--item-size) / -2); top: calc(var(--item-size) / -2); height: var(--item-size); width: calc(100vw - var(--anchor-x) - 4vw); transform: translate3d(0, calc(var(--item-offset) * var(--item-step)), 0); transition: transform 350ms cubic-bezier(0.22, 0.75, 0.25, 1), opacity 280ms ease; }"
