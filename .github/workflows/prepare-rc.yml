name: Prepare first YAG release candidate

on:
  # A newly created dedicated candidate branch triggers the trusted
  # default-branch workflow; no unreviewed source is checked out.
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: "New prerelease tag (e.g. v0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: yag-prepare-candidate
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify main and create a new candidate tag
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-candidate/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: release-candidate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify a newly created candidate branch or explicitly dispatched main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_REF: ${{ github.event.ref }}
          CREATED_REF_TYPE: ${{ github.event.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_EVENT_NAME" == create ]]; then
            if [[ "$CREATED_REF_TYPE" != branch ||
                  ! "$CREATED_REF" =~ ^release-candidate/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
              echo "Only an exact release-candidate/vMAJOR.MINOR.PATCH-rc.N branch may trigger a candidate." >&2
              exit 1
            fi
            candidate_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CREATED_REF" --jq '.object.sha')"
            if [[ "$candidate_commit" != "$current" ]]; then
              echo "Candidate trigger must point to the current reviewed main commit." >&2
              exit 1
            fi
            tag="${CREATED_REF#release-candidate/}"
          else
            if [[ "$GITHUB_REF" != refs/heads/main || "$current" != "$GITHUB_SHA" ]]; then
              echo "Main moved; re-run this review on the latest commit." >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          fi
          # The Python policy validates the exact release tag again.
          printf 'RC_TAG=%s\nREVIEWED_SHA=%s\n' "$tag" "$current" >> "$GITHUB_ENV"
      - name: Download exact main-commit CI/security run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REVIEWED_SHA&per_page=100" \
            > "$RUNNER_TEMP/yag-candidate-runs.json"
      - name: Fail closed unless newest CI and security reviews passed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_candidate.py \
            --tag "$RC_TAG" --commit "$REVIEWED_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --runs-file "$RUNNER_TEMP/yag-candidate-runs.json"
      - name: Create immutable lightweight prerelease tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never force, replace or re-sign an existing release tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RC_TAG" >/dev/null 2>&1; then
            echo "Release candidate tag already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RC_TAG" -f sha="$REVIEWED_SHA" >/dev/null
      - name: Explicitly dispatch the packaged prerelease workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN tag pushes intentionally do not trigger normal push
          # workflows. workflow_dispatch is an explicit supported exception.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RC_TAG"
          {
            echo "### Release candidate prepared"
            echo "Tag: \`$RC_TAG\`"
            echo "Commit: \`$REVIEWED_SHA\`"
            echo "Packaging, checksum and Sigstore attestation run in the release workflow."
            echo "Only prerelease publication is authorized. No production certification."
          } >> "$GITHUB_STEP_SUMMARY"
