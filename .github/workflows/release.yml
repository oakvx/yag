name: Package and release YAG

on:
  push:
    tags:
      - "v[0-9]*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "console/**"
      - "desktop/**"
      - "CMakeLists.txt"
      - "host/**"
      - "scripts/release_verify.py"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yag-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    name: Package Linux x86_64 Host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stamp native Host version from release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          # CMake VERSION permits numeric components only; preserve pre-release text in the tag.
          core_version="${version%%-*}"
          sed -i -E "s/project\(yag VERSION [^ ]+ LANGUAGES C\)/project(yag VERSION $core_version LANGUAGES C)/" CMakeLists.txt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Compile and test Host
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Compile React Console
        run: npm ci --prefix console && npm run build --prefix console
      - name: Create native Host archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/console
          cp build/yag package/
          cp -r console/dist package/console/
          cp README.md package/
          cp -r docs package/
          cat > package/RUNTIME.txt <<'EOF'
          YAG native Host for Linux x86_64
          Requires a compatible glibc and libcurl4 system runtime.
          Export YAG_API_KEY (at least 16 characters) and configure the upstream.
          Start ./yag from this extracted directory.
          The binary is dynamically linked, not a statically portable executable.
          Do not expose the listener directly on untrusted networks.
          EOF
          tar -C package -czf yag-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: yag-host-linux-x86_64
          path: yag-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Package Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            platform: linux
          - os: windows-latest
            bundles: nsis
            platform: windows
          - os: macos-latest
            bundles: dmg
            platform: macos
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stamp Desktop version from release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          node - "$version" <<'NODE'
          const fs = require('fs')
          const version = process.argv[2]
          for (const path of ['package.json', 'src-tauri/tauri.conf.json']) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'))
            data.version = version
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n')
          }
          const path = 'src-tauri/Cargo.toml'
          const original = fs.readFileSync(path, 'utf8')
          const updated = original.replace(/^version = "[^"]+"/m, 'version = "' + version + '"')
          if (updated === original) throw new Error('Could not stamp Cargo version')
          fs.writeFileSync(path, updated)
          NODE
      - name: Linux packaging prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install desktop CLI
        run: npm install --no-audit --no-fund
      - name: Check frontend and generate app icons
        run: |
          npm run check
          npm run icons
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned native package
        run: npm run build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: yag-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14


  verify-assets:
    name: Verify complete release packages
    needs: [host, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: yag-*
          path: release-input
          merge-multiple: false
      - name: Verify assets and calculate SHA-256 for every package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp release-input/yag-host-linux-x86_64/yag-linux-x86_64.tar.gz release-assets/
          version_label="${GITHUB_REF_NAME//\//-}"
          for platform in linux windows macos; do
            case "$platform" in
              linux) extension=deb ;;
              windows) extension=exe ;;
              macos) extension=dmg ;;
            esac
            mapfile -d '' files < <(find "release-input/yag-desktop-$platform" \
              -type f -name "*.$extension" -print0)
            if (( ${#files[@]} != 1 )); then
              echo "Expected exactly one $platform .$extension bundle, got ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" "release-assets/yag-desktop-$version_label-$platform.$extension"
          done
          (
            cd release-assets
            sha256sum yag-linux-x86_64.tar.gz yag-desktop-* > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
      - name: Rehearse offline verified Host staging for a tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/yag-rollback"
          python3 scripts/release_verify.py --release-dir release-assets \
            --tag "$RELEASE_TAG" \
            --stage-host "$RUNNER_TEMP/yag-rollback/$RELEASE_TAG"
          test -x "$RUNNER_TEMP/yag-rollback/$RELEASE_TAG/yag"
          test -f "$RUNNER_TEMP/yag-rollback/$RELEASE_TAG/console/dist/index.html"
      - uses: actions/upload-artifact@v7
        with:
          name: yag-release-packages
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest reviewed tag package provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yag-release-packages
          path: release-assets
      - name: Generate signed Sigstore build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: 'release-assets/*'

  release:
    name: Publish reviewed tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-assets, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers for production-release in repository settings.
    environment:
      name: ${{ contains(github.ref_name, '-') && 'release-candidate' || 'production-release' }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: yag-release-packages
          path: release-assets
      - name: Require authenticated Colibri evidence before any stable publication
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COLIBRI_QUALIFICATION_RUN_ID: ${{ vars.YAG_STABLE_QUALIFICATION_RUN_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$COLIBRI_QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Stable publication blocked: configure YAG_STABLE_QUALIFICATION_RUN_ID for an approved Colibri workflow run." >&2
            exit 1
          fi
          evidence_dir="$RUNNER_TEMP/yag-release-qualification"
          mkdir -m 700 "$evidence_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COLIBRI_QUALIFICATION_RUN_ID" \
            > "$evidence_dir/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COLIBRI_QUALIFICATION_RUN_ID/jobs?per_page=100" \
            > "$evidence_dir/jobs.json"
          python3 scripts/verify_colibri_run.py \
            --run-info "$evidence_dir/run.json" \
            --jobs "$evidence_dir/jobs.json" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          gh run download "$COLIBRI_QUALIFICATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" --name yag-real-model-qualification \
            --dir "$evidence_dir"
          python3 scripts/release_gate.py \
            --evidence "$evidence_dir/qualification.json" --commit "$GITHUB_SHA"
      - name: Publish reviewed tag assets (installers unsigned, build provenance attested)
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE_APPROVED: ${{ vars.YAG_STABLE_RELEASE_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_flags=()
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
            release_note="YAG release candidate. Experimental: installers unsigned, real Colibri qualification is NOT implied. Do not treat as a production-certified release. See docs/deployment/releases.md."
          else
            # No stable publication from a tag alone. The repository operator
            # must explicitly approve it AND review qualification evidence.
            if [[ "$STABLE_RELEASE_APPROVED" != true ]]; then
              echo "Stable publication blocked: set YAG_STABLE_RELEASE_APPROVED after approved Colibri qualification and independent security review." >&2
              exit 1
            fi
            release_note="YAG reviewed stable build. Validate release-specific Colibri qualifications and published support limitations before deployment. Installers may remain unsigned. See docs/deployment/releases.md."
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag "${release_flags[@]}" \
              --title "YAG $GITHUB_REF_NAME" \
              --notes "$release_note"
          fi
