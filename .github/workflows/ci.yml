name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: C17 host and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  native-sanitizers:
    name: Native ASan / UBSan regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure with runtime sanitizers
        run: |
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel
      - name: Exercise protocol and HTTP regression suites
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  console:
    name: React console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build

  codex-mock-probe:
    name: Codex CLI mock qualification (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build gateway
        run: cmake -S . -B build && cmake --build build --parallel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.167.0
      - name: Probe a real Codex CLI against the deterministic mock
        run: python3 tests/codex_probe.py --host ./build/yag
      - name: Probe a real Codex CLI shell tool cycle
        run: python3 tests/codex_probe.py --host ./build/yag --tool-cycle

  claude-mock-probe:
    name: Claude Code CLI mock qualification (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build gateway
        run: cmake -S . -B build && cmake --build build --parallel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@latest
      - name: Record tested Claude Code CLI version
        run: claude --version
      - name: Probe real Claude Code with isolated mock gateway
        run: python3 tests/claude_probe.py --host ./build/yag
      - name: Probe Claude Code local Read tool execution and result replay
        run: python3 tests/claude_probe.py --host ./build/yag --tool-cycle
