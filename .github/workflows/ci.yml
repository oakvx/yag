name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lan-platform:
    name: LAN setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check portable setup CLI
        run: python scripts/lan.py --help
      - name: Test credentials, ACLs and non-overwrite behavior
        run: python tests/lan_bootstrap_test.py
      - name: Test cross-platform lifecycle, Docker commands and TLS verification
        run: python tests/lan_manager_test.py

  host:
    name: C17 host and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure libcurl headers (bounded package fallback)
        run: |
          if pkg-config --exists libcurl && printf '#include <curl/curl.h>\n' | cc -x c -E - >/dev/null; then
            echo 'Using preinstalled libcurl development headers.'
          else
            timeout 120s bash -c 'sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev'
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  native-sanitizers:
    name: Native ASan / UBSan regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure libcurl headers (bounded package fallback)
        run: |
          if pkg-config --exists libcurl && printf '#include <curl/curl.h>\n' | cc -x c -E - >/dev/null; then
            echo 'Using preinstalled libcurl development headers.'
          else
            timeout 120s bash -c 'sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev'
          fi
      - name: Configure with runtime sanitizers
        run: |
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel
      - name: Exercise protocol and HTTP regression suites
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  console:
    name: React console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build

  container:
    name: Docker image build and localhost smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root gateway and React Console image
        run: docker build --tag yag:ci .
      - name: Validate Compose port is loopback-only
        env:
          YAG_API_KEY: integration-key-dummy-12345
        run: docker compose config --quiet
      - name: Validate LAN topology for existing and managed Ollama
        run: python3 tests/lan_compose_test.py
      - name: Run image and check unprivileged process
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' yag:ci)" = "10001:10001"
          docker run --detach --rm --name yag-ci-smoke \
            -p 127.0.0.1:18080:8080 \
            -e YAG_API_KEY=integration-key-dummy-12345 \
            -e YAG_UPSTREAM_URL=http://127.0.0.1:8000/v1 yag:ci
          trap 'docker stop yag-ci-smoke || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18080/health; then exit 0; fi
            sleep 1
          done
          docker logs yag-ci-smoke
          exit 1

      - name: Smoke-test LAN HTTPS, certificate trust and client isolation
        env:
          YAG_LAN_IP: 127.0.0.1
          YAG_LAN_HTTPS_PORT: "18443"
        run: |
          set -euo pipefail
          python3 scripts/lan_bootstrap.py --lan-ip 192.168.50.20 --clients 2
          docker tag yag:ci yag:local
          compose=(docker compose --env-file .env.lan -f compose.yaml -f compose.lan.yaml)
          trap '${compose[@]} down --remove-orphans || true' EXIT
          "${compose[@]}" up --no-build -d yag caddy
          ready=0
          for i in $(seq 1 15); do
            if curl -ksSf https://127.0.0.1:18443/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            "${compose[@]}" logs --no-color caddy
            exit 1
          fi
          "${compose[@]}" cp caddy:/data/caddy/pki/authorities/local/root.crt ./lan-root-ca.crt
          curl --fail --silent --show-error --cacert ./lan-root-ca.crt https://127.0.0.1:18443/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cacert ./lan-root-ca.crt https://127.0.0.1:18443/v1/models)
          test "$status" = 401
          client_key=$(sed -n 's/^YAG_EXTRA_API_KEYS=//p' .env.lan | cut -d, -f1)
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cacert ./lan-root-ca.crt -H "Authorization: Bearer $client_key" \
            https://127.0.0.1:18443/api/metrics)
          test "$status" = 403
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cacert ./lan-root-ca.crt https://127.0.0.1:18443/)
          test "$status" = 404

  codex-mock-probe:
    name: Codex CLI mock qualification (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ensure libcurl headers (bounded package fallback)
        run: |
          if pkg-config --exists libcurl && printf '#include <curl/curl.h>\n' | cc -x c -E - >/dev/null; then
            echo 'Using preinstalled libcurl development headers.'
          else
            timeout 120s bash -c 'sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev'
          fi
      - name: Build gateway
        run: cmake -S . -B build && cmake --build build --parallel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.167.0
      - name: Probe a real Codex CLI against the deterministic mock
        run: python3 tests/codex_probe.py --host ./build/yag
      - name: Probe a real Codex CLI shell tool cycle
        run: python3 tests/codex_probe.py --host ./build/yag --tool-cycle

  claude-mock-probe:
    name: Claude Code CLI mock qualification (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ensure libcurl headers (bounded package fallback)
        run: |
          if pkg-config --exists libcurl && printf '#include <curl/curl.h>\n' | cc -x c -E - >/dev/null; then
            echo 'Using preinstalled libcurl development headers.'
          else
            timeout 120s bash -c 'sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev'
          fi
      - name: Build gateway
        run: cmake -S . -B build && cmake --build build --parallel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@latest
      - name: Record tested Claude Code CLI version
        run: claude --version
      - name: Probe real Claude Code with isolated mock gateway
        run: python3 tests/claude_probe.py --host ./build/yag
      - name: Probe Claude Code local Read tool execution and result replay
        run: python3 tests/claude_probe.py --host ./build/yag --tool-cycle
