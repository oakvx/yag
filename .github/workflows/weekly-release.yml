name: Publish weekly YAG prerelease

on:
  schedule:
    # Monday at 06:17 UTC. GitHub may delay scheduled runs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: yag-weekly-prerelease
  cancel-in-progress: false

jobs:
  weekly:
    name: Review main and dispatch one immutable weekly prerelease
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Derive weekly tag from current reviewed main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewed_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$reviewed_sha" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$reviewed_sha" ]]; then
            echo "Main moved since the weekly run started; refusing stale source." >&2
            exit 1
          fi
          tag="$(python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import re
          text = Path('CMakeLists.txt').read_text(encoding='utf-8')
          match = re.search(r'^project\(yag VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$', text, re.M)
          if match is None:
              raise SystemExit('Missing numeric CMake Host version')
          today = datetime.now(timezone.utc).date()
          monday = today - timedelta(days=today.weekday())
          print(f'v{match.group(1)}-weekly.{monday:%Y%m%d}')
          PY
          )"
          printf 'WEEKLY_TAG=%s\nREVIEWED_SHA=%s\n' "$tag" "$reviewed_sha" >> "$GITHUB_ENV"

      - name: Download authenticated CI and security runs for the exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REVIEWED_SHA&per_page=100" \
            > "$RUNNER_TEMP/yag-weekly-runs.json"

      - name: Block failed, stale or unreviewed main commits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_candidate.py --weekly \
            --tag "$WEEKLY_TAG" --commit "$REVIEWED_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --runs-file "$RUNNER_TEMP/yag-weekly-runs.json"

      - name: Create immutable weekly tag and dispatch signed packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" != "$REVIEWED_SHA" ]]; then
            echo "Main advanced during weekly validation; retry after new CI/security checks." >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$WEEKLY_TAG" \
            > "$RUNNER_TEMP/yag-weekly-existing-tag.json" 2>/dev/null; then
            existing_sha="$(jq -r '.object.sha' "$RUNNER_TEMP/yag-weekly-existing-tag.json")"
            existing_type="$(jq -r '.object.type' "$RUNNER_TEMP/yag-weekly-existing-tag.json")"
            if [[ "$existing_type" != commit || "$existing_sha" != "$REVIEWED_SHA" ]]; then
              echo "Weekly tag already exists for another commit or is annotated; refusing to move it." >&2
              exit 1
            fi
            if gh release view "$WEEKLY_TAG" >/dev/null 2>&1; then
              echo "Weekly release already published for this exact commit: $WEEKLY_TAG"
              exit 0
            fi
            echo "Existing verified tag has no published release; retrying its packaging."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$WEEKLY_TAG" -f sha="$REVIEWED_SHA" >/dev/null
          fi

          # GITHUB_TOKEN tag creation cannot start a push workflow.
          # Explicit workflow_dispatch on the immutable tag is required.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$WEEKLY_TAG"
          {
            echo "### Weekly YAG experimental prerelease queued"
            echo "Tag: `$WEEKLY_TAG`"
            echo "Reviewed main commit: `$REVIEWED_SHA`"
            echo "The tagged workflow must build, verify SHA-256 and attest all packages."
            echo "Release publication is **not** production qualification."
          } >> "$GITHUB_STEP_SUMMARY"
